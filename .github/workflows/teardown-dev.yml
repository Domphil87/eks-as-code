# Tears dev down in the safe order from the README:
#   platform - remove what Argo CD deployed, the Prometheus volume and the
#              Argo CD DNS records, then destroy the platform layer
#              (CodeBuild runner in the VPC)
#   infra    - destroy cluster, then network (GitHub-hosted runner)
# Bootstrap (state bucket, budget, CI roles) is never touched.
name: teardown-dev

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type "teardown-dev" to confirm
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: dev-environment
  cancel-in-progress: false

env:
  TF_VERSION: 1.16.7
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  AWS_REGION: us-east-1
  CLUSTER_NAME: eks-platform-as-code-dev
  HOSTED_ZONE_ID: Z0294383ZBJYZ5WH4FEP
  ARGOCD_HOST: argocd.dev.domphil.org

jobs:
  status:
    name: check confirmation and dev status
    if: github.ref == 'refs/heads/main' && inputs.confirm == 'teardown-dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    outputs:
      cluster: ${{ steps.check.outputs.cluster }}
    steps:
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          role-session-name: gha-teardown-status-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
      - id: check
        run: |
          if aws eks describe-cluster --name "$CLUSTER_NAME" >/dev/null 2>&1; then
            echo "cluster=true" >> "$GITHUB_OUTPUT"
          else
            echo "cluster=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No dev cluster; skipping the platform teardown."
          fi

  platform:
    name: destroy dev/platform
    needs: status
    if: needs.status.outputs.cluster == 'true'
    runs-on: codebuild-eks-platform-as-code-dev-ci-runner-${{ github.run_id }}-${{ github.run_attempt }}
    environment: dev
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    env:
      TF_VAR_admin_cidrs: ${{ secrets.ADMIN_CIDRS }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          role-session-name: gha-teardown-platform-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 7200
      - uses: ./.github/actions/setup-kubectl

      # Steps the Terraform destroy cannot do by itself (README "Teardown").
      - name: remove what Argo CD deployed
        run: |
          aws eks update-kubeconfig --name "$CLUSTER_NAME" --region "$AWS_REGION" >/dev/null
          if kubectl -n argocd get application root >/dev/null 2>&1; then
            # Its finalizer deletes the apps, their Ingresses (ALB rules, DNS) and PVCs.
            kubectl -n argocd delete application root --wait=true --timeout=10m
          fi

      - name: delete the Prometheus volume (Helm keeps StatefulSet PVCs)
        run: |
          if kubectl -n monitoring get prometheus kube-prometheus-stack-prometheus >/dev/null 2>&1; then
            kubectl -n monitoring patch prometheus kube-prometheus-stack-prometheus --type=merge -p '{"spec":{"replicas":0}}'
            kubectl -n monitoring wait --for=delete pod/prometheus-kube-prometheus-stack-prometheus-0 --timeout=5m || true
          fi
          kubectl -n monitoring delete pvc --all --wait=true --timeout=5m
          left=$(kubectl get pvc -A --no-headers 2>/dev/null | wc -l)
          if [ "$left" -ne 0 ]; then kubectl get pvc -A; echo "::error::PVCs left; their volumes would be orphaned"; exit 1; fi

      - name: delete the Argo CD Ingress while ExternalDNS still runs
        run: |
          kubectl -n argocd delete ingress argocd-server --ignore-not-found --wait=true --timeout=5m
          for i in $(seq 1 30); do
            n=$(aws route53 list-resource-record-sets --hosted-zone-id "$HOSTED_ZONE_ID" \
                  --query "length(ResourceRecordSets[?contains(Name, '${ARGOCD_HOST}')])" --output text)
            if [ "$n" = "0" ]; then echo "DNS records removed"; exit 0; fi
            sleep 10
          done
          echo "::error::ExternalDNS did not remove ${ARGOCD_HOST}"; exit 1

      - name: destroy platform
        working-directory: envs/dev/platform
        run: |
          terraform init -input=false
          terraform plan -destroy -input=false -no-color -lock-timeout=5m -out=destroy.tfplan
          terraform apply -input=false -no-color -lock-timeout=5m destroy.tfplan

  infra:
    name: destroy dev/cluster + dev/network
    needs: [status, platform]
    # Also runs when the cluster was already gone (platform skipped).
    if: always() && needs.status.result == 'success' && (needs.platform.result == 'success' || needs.platform.result == 'skipped')
    runs-on: ubuntu-24.04
    environment: dev
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    env:
      TF_VAR_endpoint_public_access_cidrs: ${{ secrets.ADMIN_CIDRS }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          role-session-name: gha-teardown-infra-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 7200
      - name: destroy cluster
        working-directory: envs/dev/cluster
        run: |
          terraform init -input=false
          if [ "$(terraform output -json)" = "{}" ]; then echo "cluster layer already empty"; exit 0; fi
          terraform plan -destroy -input=false -no-color -lock-timeout=5m -out=destroy.tfplan
          terraform apply -input=false -no-color -lock-timeout=5m destroy.tfplan
      - name: destroy network
        working-directory: envs/dev/network
        run: |
          terraform init -input=false
          # CodeBuild can take a few minutes to release a finished build's
          # network interface, which blocks deleting its subnet; retry.
          for attempt in 1 2 3 4; do
            terraform plan -destroy -input=false -no-color -lock-timeout=5m -out=destroy.tfplan
            if terraform apply -input=false -no-color -lock-timeout=5m destroy.tfplan; then exit 0; fi
            echo "::warning::network destroy attempt $attempt failed; retrying in 3 minutes"
            sleep 180
          done
          exit 1
      - name: leftover check
        run: |
          {
            echo "### dev torn down"
            echo "- load balancers: $(aws elbv2 describe-load-balancers --query "length(LoadBalancers[?starts_with(LoadBalancerName,'k8s-eksplatformascode')])")"
            echo "- CSI volumes: $(aws ec2 describe-volumes --filters Name=tag-key,Values=ebs.csi.aws.com/cluster --query 'length(Volumes)')"
            echo "- NAT gateways (project): $(aws ec2 describe-nat-gateways --filter Name=tag:Project,Values=eks-platform-as-code Name=state,Values=pending,available,deleting --query 'length(NatGateways)')"
            echo "- dev DNS records: $(aws route53 list-resource-record-sets --hosted-zone-id "$HOSTED_ZONE_ID" --query "length(ResourceRecordSets[?contains(Name,'dev.domphil.org')])")"
          } | tee -a "$GITHUB_STEP_SUMMARY"
