# Builds (or updates) the whole dev environment from main:
#   infra    - network, then cluster   (GitHub-hosted runner)
#   platform - add-ons and Argo CD     (CodeBuild runner in the VPC, which
#              the network layer creates)
# Both jobs run in the protected "dev" environment, so each waits for a
# reviewer's approval, and only then may it assume the apply role.
name: deploy-dev

on:
  workflow_dispatch:

permissions:
  contents: read

# Never run a deploy and a teardown at the same time.
concurrency:
  group: dev-environment
  cancel-in-progress: false

env:
  TF_VERSION: 1.16.7
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  AWS_REGION: us-east-1
  RUNNER_PROJECT: eks-platform-as-code-dev-ci-runner

jobs:
  infra:
    name: apply dev/network + dev/cluster
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: dev
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    env:
      TF_VAR_endpoint_public_access_cidrs: ${{ secrets.ADMIN_CIDRS }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          role-session-name: gha-deploy-infra-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 7200
      - name: apply network, then cluster
        run: |
          for layer in network cluster; do
            echo "::group::dev/$layer"
            dir="envs/dev/$layer"
            terraform -chdir="$dir" init -input=false
            terraform -chdir="$dir" plan -input=false -no-color -lock-timeout=5m -out=tfplan
            terraform -chdir="$dir" apply -input=false -no-color -lock-timeout=5m tfplan
            echo "::endgroup::"
          done

  platform:
    name: apply dev/platform
    needs: infra
    runs-on: codebuild-eks-platform-as-code-dev-ci-runner-${{ github.run_id }}-${{ github.run_attempt }}
    environment: dev
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    env:
      TF_VAR_admin_cidrs: ${{ secrets.ADMIN_CIDRS }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          role-session-name: gha-deploy-platform-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 7200
      - name: apply platform
        working-directory: envs/dev/platform
        run: |
          terraform init -input=false
          terraform plan -input=false -no-color -lock-timeout=5m -out=tfplan
          terraform apply -input=false -no-color -lock-timeout=5m tfplan
      - uses: ./.github/actions/setup-kubectl
      - name: smoke test
        run: |
          aws eks update-kubeconfig --name eks-platform-as-code-dev --region "$AWS_REGION" >/dev/null
          kubectl get nodes -o wide
          # Argo CD syncs gitops/ from main. Wait until the root app AND every
          # child Application in gitops/apps exists (waiting on "--all" too
          # early would only see root), then until all are Healthy.
          expected=$(( $(ls gitops/apps/*.yaml | wc -l) + 1 ))
          for i in $(seq 1 60); do
            count=$(kubectl -n argocd get applications --no-headers 2>/dev/null | wc -l)
            [ "$count" -ge "$expected" ] && break
            sleep 10
          done
          echo "Applications: $count of $expected"
          [ "$count" -ge "$expected" ] || { echo "::error::Argo CD created $count of $expected Applications"; exit 1; }
          kubectl -n argocd wait applications --all --for=jsonpath='{.status.health.status}'=Healthy --timeout=15m
          curl -fsS -o /dev/null -w "hello.dev.domphil.org: %{http_code}\n" --retry 10 --retry-delay 15 --retry-all-errors https://hello.dev.domphil.org/
          kubectl -n argocd get applications
          {
            echo "### dev deployed"
            echo '```'
            kubectl get nodes
            kubectl -n argocd get applications
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
