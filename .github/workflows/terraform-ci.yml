# Checks every pull request (and main) before anything reaches AWS:
#   static  - terraform fmt + validate, TFLint, Checkov, kubeconform (no AWS access)
#   plan    - terraform plan per layer with the read-only role, posted on the PR
#
# Actions are pinned to full commit SHAs (tags can be moved); tool
# versions are pinned below. Terraform matches the local version so state
# written by either stays compatible.
name: terraform-ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_VERSION: 1.16.7
  TFLINT_VERSION: v0.65.0
  CHECKOV_VERSION: 3.4.3
  KUBECONFORM_VERSION: v0.8.0
  KUBERNETES_VERSION: 1.36.0
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  AWS_REGION: us-east-1

jobs:
  static:
    name: fmt, validate, lint, security scan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff

      - name: terraform validate (every root module)
        run: |
          for dir in bootstrap envs/dev/network envs/dev/cluster envs/dev/platform; do
            echo "::group::$dir"
            terraform -chdir="$dir" init -backend=false -input=false >/dev/null
            terraform -chdir="$dir" validate -no-color
            echo "::endgroup::"
          done

      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}

      - name: tflint
        env:
          GITHUB_TOKEN: ${{ github.token }} # avoids rate limits when downloading the AWS ruleset
        run: |
          tflint --init
          tflint --recursive --format compact

      - name: checkov (Terraform and workflows)
        run: |
          pipx install "checkov==${CHECKOV_VERSION}"
          checkov --directory . --framework terraform github_actions --quiet --compact --skip-path .terraform

      - name: kubeconform (gitops manifests)
        run: |
          curl -fsSL -o /tmp/kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp kubeconform
          mkdir -p /tmp/rendered
          for app in gitops/workloads/*/*/; do
            kubectl kustomize "$app" > "/tmp/rendered/$(echo "$app" | tr '/' '_').yaml"
          done
          # Argo CD CRDs (Application, AppProject) come from the CRDs catalog.
          /tmp/kubeconform -strict -summary \
            -kubernetes-version "${KUBERNETES_VERSION}" \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            gitops/apps gitops/teams /tmp/rendered

  # Which dev layers are deployed? A layer reads its upstream layer's
  # outputs, so it can only be planned while the upstream layer exists.
  status:
    name: dev status
    needs: static
    # Fork PRs get no OIDC token and no secrets; skip them instead of failing.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    outputs:
      network: ${{ steps.check.outputs.network }}
      cluster: ${{ steps.check.outputs.cluster }}
      runner: ${{ steps.check.outputs.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          role-session-name: gha-status-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
      - name: read layer outputs
        id: check
        run: |
          for layer in network cluster; do
            terraform -chdir="envs/dev/$layer" init -input=false >/dev/null
            if [ "$(terraform -chdir="envs/dev/$layer" output -json)" = "{}" ]; then
              echo "$layer=false" >> "$GITHUB_OUTPUT"
            else
              echo "$layer=true" >> "$GITHUB_OUTPUT"
            fi
          done
          runner=$(terraform -chdir=envs/dev/network output -raw ci_runner_project_name 2>/dev/null || true)
          echo "runner=${runner}" >> "$GITHUB_OUTPUT"
          echo "network deployed: $(grep network= "$GITHUB_OUTPUT"), runner: ${runner:-none}"

  plan:
    name: plan dev/${{ matrix.layer }}
    needs: status
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # exchange the GitHub OIDC token for AWS credentials
      pull-requests: write # post the plan as a PR comment
    strategy:
      fail-fast: false
      matrix:
        layer: [network, cluster]
    env:
      # Admin IPs live outside Git; the variables are marked sensitive,
      # so plans print "(sensitive value)" instead of the IP.
      TF_VAR_endpoint_public_access_cidrs: ${{ secrets.ADMIN_CIDRS }}
      TF_VAR_admin_cidrs: ${{ secrets.ADMIN_CIDRS }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          role-session-name: gha-plan-${{ matrix.layer }}-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: ./.github/actions/terraform-plan
        with:
          layer: dev/${{ matrix.layer }}
          ready: ${{ matrix.layer == 'network' && 'true' || needs.status.outputs.network }}

  # The platform layer talks to the Kubernetes API, so it is planned on the
  # CodeBuild runner inside the VPC (ADR 0003). While dev is down there is
  # no runner: the job then runs on GitHub's runner and only reports "skipped".
  plan-platform:
    name: plan dev/platform
    needs: status
    runs-on: ${{ needs.status.outputs.cluster == 'true' && needs.status.outputs.runner != '' && format('codebuild-{0}-{1}-{2}', needs.status.outputs.runner, github.run_id, github.run_attempt) || 'ubuntu-24.04' }}
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    env:
      TF_VAR_endpoint_public_access_cidrs: ${{ secrets.ADMIN_CIDRS }}
      TF_VAR_admin_cidrs: ${{ secrets.ADMIN_CIDRS }}
      READY: ${{ needs.status.outputs.cluster == 'true' && needs.status.outputs.runner != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        if: env.READY == 'true'
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        if: env.READY == 'true'
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          role-session-name: gha-plan-platform-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: ./.github/actions/terraform-plan
        with:
          layer: dev/platform
          ready: ${{ env.READY }}
          skip-reason: The dev cluster (or its CI runner) is not deployed.
