# Team namespaces and their guardrails (Milestone 5c): one folder per
# team under gitops/teams. Platform-owned, so it uses the default project.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: teams
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Domphil87/eks-as-code.git
    targetRevision: main
    path: gitops/teams
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
