# No replicas field: the HorizontalPodAutoscaler owns the count (2-6),
# so Argo CD does not fight it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello
spec:
  revisionHistoryLimit: 5
  strategy:
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels: {} # filled in by kustomize labels
  template:
    spec:
      # Zero-downtime rollouts behind the ALB: preStop keeps a stopping pod
      # serving while the ALB deregisters it (deregistration delay 30 s,
      # see ingress.yaml), and the grace period leaves room for both.
      terminationGracePeriodSeconds: 45
      # Pod Security "restricted" (enforced on team-a).
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      # Spread replicas over AZs (Spot nodes can disappear).
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: hello
      initContainers:
        # Appends one line per pod start to the shared EFS log.
        - name: register
          image: public.ecr.aws/docker/library/busybox:1.38.0
          command:
            - sh
            - -c
            - echo "$(date -u +%FT%TZ) $POD_NAME started on $NODE_NAME" >> /shared/pods.log
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 50m, memory: 32Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - {name: shared, mountPath: /shared}
      containers:
        - name: nginx
          image: public.ecr.aws/nginx/nginx-unprivileged:1.30.6-alpine
          ports:
            - {name: http, containerPort: 8080}
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          lifecycle:
            preStop:
              sleep:
                seconds: 15
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          volumeMounts:
            - {name: content, mountPath: /usr/share/nginx/html/index.html, subPath: index.html}
            - {name: content, mountPath: /etc/nginx/conf.d/default.conf, subPath: default.conf}
            - {name: shared, mountPath: /shared, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: content
          configMap:
            name: hello-content
        - name: shared
          persistentVolumeClaim:
            claimName: hello-shared
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
