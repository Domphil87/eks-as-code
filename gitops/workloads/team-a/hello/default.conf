server {
    listen 8080;
    server_tokens off;

    location / {
        root  /usr/share/nginx/html;
        index index.html;
    }

    # Shared EFS volume (ReadWriteMany), mounted read-only here.
    location /shared/ {
        alias /shared/;
        autoindex on;
        default_type text/plain;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
