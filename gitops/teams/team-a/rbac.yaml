# Developers get the built-in "edit" role in their own namespace only.
# "edit" cannot change Roles, RoleBindings, quotas or limits, so the
# guardrails above stay with the platform team.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: team-a-developers-edit
  namespace: team-a
subjects:
  - kind: Group
    name: team-a-developers
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: edit
  apiGroup: rbac.authorization.k8s.io
