{{- /*
No auth block: ESO uses its controller's Pod Identity role, which IAM
limits to reading this environment's secret prefix.
*/ -}}
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ required "name is required" .Values.name }}
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ required "region is required" .Values.region | quote }}
