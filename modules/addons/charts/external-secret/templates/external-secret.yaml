apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ required "name is required" .Values.name }}
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: {{ .Values.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ required "storeName is required" .Values.storeName }}
  target:
    name: {{ .Values.name }}
  dataFrom:
    - extract:
        key: {{ required "remoteKey is required" .Values.remoteKey | quote }}
